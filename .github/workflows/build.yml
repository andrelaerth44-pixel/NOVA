name: NOVA build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt
      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo build --release
      - run: cargo run --release -- version

      - name: Language smoke test
        shell: bash
        run: |
          cat > /tmp/hello.nova <<'EOF'
          fn add(a, b) {
              return a + b
          }
          name = "NOVA"
          print "Hello " + name
          print add(20, 22)
          EOF
          cargo run --release -- check /tmp/hello.nova
          cargo run --release -- run /tmp/hello.nova | tee /tmp/hello.out
          grep -Fxq "Hello NOVA" /tmp/hello.out
          grep -Fxq "42" /tmp/hello.out

      - name: Native backend smoke test
        shell: bash
        run: |
          cat > /tmp/native.nova <<'EOF'
          fn add(a, b) {
              return a + b
          }
          print add(20, 22)
          EOF
          cargo run --release -- build-native /tmp/native.nova /tmp/nova-native
          test -x /tmp/nova-native
          test "$(/tmp/nova-native)" = "42"

      - name: Compiler pipeline and SSA smoke test
        shell: bash
        run: |
          cargo run --release -- ssa examples/ssa.nova > /tmp/ssa.out
          test -s /tmp/ssa.out
          cat /tmp/ssa.out
          grep -Fq 'fn <main>' /tmp/ssa.out
          grep -Fq 'fn sum_to(limit: I64) -> I64' /tmp/ssa.out
          grep -Fq 'I64' /tmp/ssa.out
          grep -Fq 'Phi' /tmp/ssa.out
          cargo run --release -- check examples/ssa.nova

      - name: SSA loop smoke test
        shell: bash
        run: |
          cat > /tmp/ssa_loop.nova <<'EOF'
          x = 0
          while x < 3 {
              x = x + 1
          }
          print x
          EOF
          cargo run --release -- check /tmp/ssa_loop.nova

      - name: SSA control-flow smoke test
        shell: bash
        run: cargo run --release -- check examples/ssa_control_flow.nova

      - name: Explicit type smoke test
        shell: bash
        run: cargo run --release -- check examples/typed.nova

      - name: Enum smoke test
        shell: bash
        run: cargo run --release -- check examples/enums.nova

      - name: Pattern matching smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/match.nova
          cargo run --release -- run examples/match.nova | grep -Fxq "network"

      - name: Struct smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/structs.nova
          cargo run --release -- run examples/structs.nova > /tmp/structs.out
          grep -Fxq "Laerth" /tmp/structs.out
          grep -Fxq "18" /tmp/structs.out
          grep -Fxq "true" /tmp/structs.out

      - name: Generics smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/generics.nova
          cargo run --release -- run examples/generics.nova > /tmp/generics.out
          grep -Fxq "42" /tmp/generics.out
          grep -Fxq "NOVA" /tmp/generics.out
          grep -Fxq "99" /tmp/generics.out
          grep -Fxq "done" /tmp/generics.out
          grep -Fxq "fallback" /tmp/generics.out
          grep -Fxq "10" /tmp/generics.out

      - name: Collection smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/collections.nova
          cargo run --release -- run examples/collections.nova > /tmp/collections.out
          grep -Fxq "99" /tmp/collections.out
          grep -Fxq "true" /tmp/collections.out
          test "$(grep -c '^true$' /tmp/collections.out)" -ge 2
          grep -Fxq "2" /tmp/collections.out
          grep -Fxq "3" /tmp/collections.out
          grep -Fxq "100" /tmp/collections.out

      - name: Closure capture smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/closures.nova
          cargo run --release -- ssa examples/closures.nova > /tmp/closures.ssa
          grep -Fq 'Closure' /tmp/closures.ssa
          grep -Fq 'captures' /tmp/closures.ssa
          grep -Fq 'CallIndirect' /tmp/closures.ssa
          grep -Fq 'make_counter__closure0' /tmp/closures.ssa
          grep -Fq 'value' /tmp/closures.ssa
          cargo run --release -- abi examples/closures.nova > /tmp/closures.abi
          grep -Fq 'NOVA ABI v1' /tmp/closures.abi
          grep -Fq 'make_counter__closure0' /tmp/closures.abi
          grep -Fq 'NovaEnv*' /tmp/closures.abi
          cargo run --release -- build-native-ssa examples/closures.nova /tmp/nova-ssa-native
          test -x /tmp/nova-ssa-native
          test "$(/tmp/nova-ssa-native)" = $'1\n2'
          cargo run --release -- run examples/closures.nova > /tmp/closures.out
          grep -Fxq "1" /tmp/closures.out
          grep -Fxq "2" /tmp/closures.out

      - name: Native struct smoke test
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/structs.nova /tmp/nova-struct-native
          test -x /tmp/nova-struct-native
          test "$(/tmp/nova-struct-native)" = $'Laerth\n18\ntrue'

      - name: Native enum smoke test
        shell: bash
        run: |
          cat > /tmp/native_enum.nova <<'EOF'
          enum Status {
              Ready
              Running
              Failed(string)
          }

          status = Failed("oops")
          match status {
              Failed(message) {
                  print message
              },
              else {
                  print "other"
              }
          }
          EOF
          cargo run --release -- check /tmp/native_enum.nova
          cargo run --release -- ssa /tmp/native_enum.nova > /tmp/native_enum.ssa
          grep -Fq 'EnumInit' /tmp/native_enum.ssa
          grep -Fq 'EnumTest' /tmp/native_enum.ssa
          grep -Fq 'EnumPayload' /tmp/native_enum.ssa
          cargo run --release -- build-native-ssa /tmp/native_enum.nova /tmp/nova-enum-native
          test -x /tmp/nova-enum-native
          test "$(/tmp/nova-enum-native)" = "oops"

      - name: Native SSA control-flow smoke test
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/ssa_control_flow.nova /tmp/nova-cfg-native
          test -x /tmp/nova-cfg-native
          test "$(/tmp/nova-cfg-native)" = "ok"

          cargo run --release -- build-native-ssa examples/ssa.nova /tmp/nova-loop-native
          test -x /tmp/nova-loop-native
          test "$(/tmp/nova-loop-native)" = "15"

      - name: Native for-loop smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/native_for.nova
          cargo run --release -- build-native-ssa examples/native_for.nova /tmp/nova-for-native
          test -x /tmp/nova-for-native
          test "$(/tmp/nova-for-native)" = "60"

      - name: Native iterator smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/native_iterator.nova
          cargo run --release -- build-native-ssa examples/native_iterator.nova /tmp/nova-iterator-native
          test -x /tmp/nova-iterator-native
          /tmp/nova-iterator-native > /tmp/nova-iterator.out
          cat > /tmp/nova-iterator.expected <<'EOF'
          60
          true
          N
          3
          9
          EOF
          diff -u /tmp/nova-iterator.expected /tmp/nova-iterator.out

      - name: Native structured mutation smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/native_mutation.nova
          cargo run --release -- build-native-ssa examples/native_mutation.nova /tmp/nova-mutation-native
          test -x /tmp/nova-mutation-native
          /tmp/nova-mutation-native > /tmp/nova-mutation.out
          grep -Fxq "21" /tmp/nova-mutation.out
          grep -Fxq "9" /tmp/nova-mutation.out
          grep -Fxq "42" /tmp/nova-mutation.out
          grep -Fxq "7" /tmp/nova-mutation.out

      - name: Standard library smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/stdlib.nova
          cargo run --release -- run examples/stdlib.nova > /tmp/stdlib.out
          cat /tmp/stdlib.out
          cat > /tmp/stdlib.expected <<'EOF'
          main.nova
          nova
          main
          O
          true
          NOVA
          42
          {"name":"NOVA","value":42.0}
          true
          EOF
          diff -u /tmp/stdlib.expected /tmp/stdlib.out

      - name: Iterator smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/iterators.nova
          cargo run --release -- run examples/iterators.nova > /tmp/iterators.out
          grep -Fxq "true" /tmp/iterators.out
          grep -Fxq "1" /tmp/iterators.out
          grep -Fxq "2" /tmp/iterators.out
          grep -Fxq "1" /tmp/iterators.out
          grep -Fxq "3" /tmp/iterators.out
          grep -Fxq "18" /tmp/iterators.out
          grep -Fxq "N" /tmp/iterators.out

      - name: Try propagation smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/try.nova
          cargo run --release -- run examples/try.nova > /tmp/try.out
          grep -Fxq "50" /tmp/try.out
          grep -Fxq "true" /tmp/try.out
          grep -Fxq "Hello NOVA" /tmp/try.out
          grep -Fxq "fallback" /tmp/try.out

      - name: Package resolver smoke test
        shell: bash
        run: |
          rm -rf /tmp/nova-packages
          mkdir -p /tmp/nova-packages/app /tmp/nova-packages/util
          cat > /tmp/nova-packages/app/nova.toml <<'EOF'
          [package]
          name = "app"
          version = "0.1.0"

          [dependencies]
          util = { path = "../util" }
          EOF
          cat > /tmp/nova-packages/util/nova.toml <<'EOF'
          [package]
          name = "util"
          version = "0.2.0"
          EOF
          cargo run --release -- package-check /tmp/nova-packages/app > /tmp/nova-package.out
          grep -Fxq "app 0.1.0 root" /tmp/nova-package.out
          grep -Fxq "util 0.2.0 path:../util" /tmp/nova-package.out
          grep -Fxq "ok" /tmp/nova-package.out
          cargo run --release -- package-lock /tmp/nova-packages/app > /tmp/nova-lock-path.out
          test -f /tmp/nova-packages/app/nova.lock
          grep -Fxq 'format = 1' /tmp/nova-packages/app/nova.lock
          grep -Fxq 'name = "app"' /tmp/nova-packages/app/nova.lock
          grep -Fxq 'name = "util"' /tmp/nova-packages/app/nova.lock

      - name: Module graph smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/modules/main.nova
          cargo run --release -- run examples/modules/main.nova | grep -Fxq "42"

      - name: Module cycle diagnostic smoke test
        shell: bash
        run: |
          if cargo run --release -- check examples/modules/cycle_a.nova >/tmp/nova-cycle.out 2>&1; then
            echo "expected module cycle to fail"
            exit 1
          fi
          grep -q "module import cycle" /tmp/nova-cycle.out
