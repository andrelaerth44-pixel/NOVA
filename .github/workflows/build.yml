name: NOVA build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt
      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo build --release
      - run: cargo run --release -- version
      - name: Language smoke test
        shell: bash
        run: |
          cat > /tmp/hello.nova <<'EOF'
          fn add(a, b) {
              return a + b
          }
          name = "NOVA"
          print "Hello " + name
          print add(20, 22)
          EOF
          cargo run --release -- check /tmp/hello.nova
          cargo run --release -- run /tmp/hello.nova
      - name: Native backend smoke test
        shell: bash
        run: |
          cat > /tmp/native.nova <<'EOF'
          fn add(a, b) {
              return a + b
          }
          print add(20, 22)
          EOF
          cargo run --release -- build-native /tmp/native.nova /tmp/nova-native
          test -x /tmp/nova-native
          test "$(/tmp/nova-native)" = "42"
      - name: SSA loop smoke test
        shell: bash
        run: |
          cat > /tmp/ssa_loop.nova <<'EOF'
          x = 0
          while x < 3 {
              x = x + 1
          }
          print x
          EOF
          cargo run --release -- check /tmp/ssa_loop.nova
      - name: SSA control-flow smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/ssa_control_flow.nova
      - name: Explicit type smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/typed.nova
      - name: Enum smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/enums.nova
      - name: Pattern matching smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/match.nova
          test "$(cargo run --release -- run examples/match.nova)" = network
      - name: Struct smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/structs.nova
          test "$(cargo run --release -- run examples/structs.nova)" = $'Laerth
          18
          true'
      - name: Generics smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/generics.nova
          test "$(cargo run --release -- run examples/generics.nova)" = $'42
          NOVA
          42
          99
          done
          fallback
          10'
      - name: Collection smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/collections.nova
          test "$(cargo run --release -- run examples/collections.nova)" = 
        shell: bash
        run: |
          cargo run --release -- check examples/closures.nova
          test "$(cargo run --release -- run examples/closures.nova)" = 
        shell: bash
        run: |
          cargo run --release -- check examples/try.nova
          test "$(cargo run --release -- run examples/try.nova)" = $'50
          true
          Hello NOVA
          fallback'
      - name: Module graph smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/modules/main.nova
          test "$(cargo run --release -- run examples/modules/main.nova)" = "42"
      - name: Module cycle diagnostic smoke test
        shell: bash
        run: |
          if cargo run --release -- check examples/modules/cycle_a.nova >/tmp/nova-cycle.out 2>&1; then
            echo "expected module cycle to fail"
            exit 1
          fi
          grep -q "module import cycle" /tmp/nova-cycle.out
1
          2'

      - name: Try propagation smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/try.nova
          test "$(cargo run --release -- run examples/try.nova)" = $'50
          true
          Hello NOVA
          fallback'
      - name: Module graph smoke test
        shell: bash
        run: |
          cargo run --release -- check examples/modules/main.nova
          test "$(cargo run --release -- run examples/modules/main.nova)" = "42"
