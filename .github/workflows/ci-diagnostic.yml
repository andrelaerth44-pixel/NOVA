name: NOVA CI diagnostic

on:
  push:
    branches:
      - feat/native-closure-abi

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Inspect build run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${{ github.repository }}/actions/runs/35388890052/jobs?per_page=100"             > /tmp/build-jobs.json
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: build-run-378-jobs
          path: /tmp/build-jobs.json
