name: NOVA diagnostic

on:
  push:
    branches:
      - feat/native-closure-abi

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture cargo test
        shell: bash
        run: |
          set +e
          cargo test --all-targets > /tmp/cargo-test.log 2>&1
          status=$?
          {
            echo "exit_code=$status"
            cat /tmp/cargo-test.log
          } > /tmp/diagnostic.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: nova-diagnostic
          path: /tmp/diagnostic.log
