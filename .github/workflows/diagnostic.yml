name: NOVA diagnostic

on:
  push:
    branches:
      - feat/native-closure-abi

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture workflow preflight
        shell: bash
        run: |
          set +e
          cargo fmt -- --check > /tmp/fmt.log 2>&1; a=$?
          cargo test > /tmp/test.log 2>&1; b=$?
          cargo build --release > /tmp/build.log 2>&1; c=$?
          cargo run --release -- version > /tmp/version.log 2>&1; d=$?
          {
            echo "fmt=$a test=$b build=$c version=$d"
            echo "===== fmt ====="
            cat /tmp/fmt.log
            echo "===== test tail ====="
            tail -n 40 /tmp/test.log
            echo "===== build tail ====="
            tail -n 30 /tmp/build.log
            echo "===== version ====="
            cat /tmp/version.log
          } > /tmp/diagnostic.log
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: nova-preflight
          path: /tmp/diagnostic.log
