name: NOVA diagnostic

on:
  push:
    branches:
      - feat/native-closure-abi

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Reproduce format sequence
        shell: bash
        run: |
          set +e
          cargo fmt > /tmp/fmt-run.log 2>&1; a=$?
          cargo fmt -- --check > /tmp/fmt-check.log 2>&1; b=$?
          cargo test > /tmp/test.log 2>&1; c=$?
          {
            echo "cargo_fmt=$a cargo_fmt_check=$b cargo_test=$c"
            echo "===== cargo fmt ====="
            cat /tmp/fmt-run.log
            echo "===== cargo fmt check ====="
            cat /tmp/fmt-check.log
            echo "===== cargo test tail ====="
            tail -n 40 /tmp/test.log
          } > /tmp/diagnostic.log
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: nova-format-sequence
          path: /tmp/diagnostic.log
