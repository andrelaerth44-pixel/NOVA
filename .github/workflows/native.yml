name: NOVA native backend

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt
      - run: cargo fmt -- --check
      - run: cargo test
      - run: cargo build --release

      - name: Native C source export
        shell: bash
        run: |
          cargo run --release -- build-native-ssa-c examples/hello.nova /tmp/nova-hello.c
          test -s /tmp/nova-hello.c
          grep -Fq 'nova_main' /tmp/nova-hello.c

      - name: Native closure
        shell: bash
        run: |
          cargo run --release -- check examples/closures.nova
          cargo run --release -- abi examples/closures.nova > /tmp/closures.abi
          grep -Fq 'NOVA ABI v1' /tmp/closures.abi
          cargo run --release -- build-native-ssa examples/closures.nova /tmp/nova-closure
          /tmp/nova-closure > /tmp/closures.out
          cat > /tmp/closures.expected <<'EOF'
          1
          2
          EOF
          diff -u /tmp/closures.expected /tmp/closures.out

      - name: Native struct
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/structs.nova /tmp/nova-struct
          /tmp/nova-struct > /tmp/struct.out
          cat > /tmp/struct.expected <<'EOF'
          Laerth
          18
          true
          EOF
          diff -u /tmp/struct.expected /tmp/struct.out

      - name: Native enum
        shell: bash
        run: |
          cat > /tmp/native_enum.nova <<'EOF'
          enum Status {
              Ready
              Running
              Failed(string)
          }
          status = Failed("oops")
          match status {
              Failed(message) {
                  print message
              },
              else {
                  print "other"
              }
          }
          EOF
          cargo run --release -- check /tmp/native_enum.nova
          cargo run --release -- build-native-ssa /tmp/native_enum.nova /tmp/nova-enum
          test "$(/tmp/nova-enum)" = "oops"

      - name: Native control flow and Phi
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/ssa_control_flow.nova /tmp/nova-cfg
          /tmp/nova-cfg > /tmp/cfg.out
          cat > /tmp/cfg.expected <<'EOF'
          ok
          truthy
          EOF
          diff -u /tmp/cfg.expected /tmp/cfg.out
          cargo run --release -- build-native-ssa examples/ssa.nova /tmp/nova-loop
          test "$(/tmp/nova-loop)" = "15"

      - name: Native for and iterator
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/native_for.nova /tmp/nova-for
          test "$(/tmp/nova-for)" = "60"
          cargo run --release -- build-native-ssa examples/native_iterator.nova /tmp/nova-iterator
          /tmp/nova-iterator > /tmp/iterator.out
          cat > /tmp/iterator.expected <<'EOF'
          60
          true
          N
          3
          9
          EOF
          diff -u /tmp/iterator.expected /tmp/iterator.out

      - name: Native collections and mutation
        shell: bash
        run: |
          cargo run --release -- build-native-ssa examples/collections.nova /tmp/nova-collections
          /tmp/nova-collections > /tmp/collections.out
          cat > /tmp/collections.expected <<'EOF'
          99
          true
          true
          2
          3
          100
          true
          true
          true
          true
          EOF
          diff -u /tmp/collections.expected /tmp/collections.out

          cargo run --release -- build-native-ssa examples/native_mutation.nova /tmp/nova-mutation
          /tmp/nova-mutation > /tmp/mutation.out
          grep -Fxq "21" /tmp/mutation.out
          grep -Fxq "9" /tmp/mutation.out
          grep -Fxq "42" /tmp/mutation.out
          grep -Fxq "7" /tmp/mutation.out

      - name: Native standard library
        shell: bash
        run: |
          export NOVA_NATIVE_ENV="native-ok"
          cargo run --release -- build-native-ssa examples/native_stdlib.nova /tmp/nova-stdlib
          /tmp/nova-stdlib > /tmp/stdlib.out
          cat > /tmp/stdlib.expected <<'EOF'
          true
          hello NOVA
          NOVA-native-test.txt
          txt
          NOVA-native-test
          native-ok
          O
          4
          42
          7
          7
          true
          false
          EOF
          diff -u /tmp/stdlib.expected /tmp/stdlib.out

      - name: Self-hosted lexer
        shell: bash
        run: |
          cargo run --release -- check examples/selfhost_lexer.nova
          cargo run --release -- build-native-ssa examples/selfhost_lexer.nova /tmp/nova-selfhost-lexer
          /tmp/nova-selfhost-lexer > /tmp/selfhost-lexer.out
          cat > /tmp/selfhost-lexer.expected <<'EOF'
          20
          fn
          add
          i64
          eof
          EOF
          diff -u /tmp/selfhost-lexer.expected /tmp/selfhost-lexer.out

      - name: Self-hosted parser
        shell: bash
        run: |
          cargo run --release -- check examples/selfhost_parser.nova
          cargo run --release -- build-native-ssa examples/selfhost_parser.nova /tmp/nova-selfhost-parser
          /tmp/nova-selfhost-parser > /tmp/selfhost-parser.out
          cat > /tmp/selfhost-parser.expected <<'EOF'
          program
          1
          fn
          add
          a
          EOF
          diff -u /tmp/selfhost-parser.expected /tmp/selfhost-parser.out

      - name: Self-hosted full parser
        shell: bash
        run: |
          cargo run --release -- check examples/selfhost_parser_full.nova
          cargo run --release -- build-native-ssa examples/selfhost_parser_full.nova /tmp/nova-selfhost-parser-full
          /tmp/nova-selfhost-parser-full > /tmp/selfhost-parser-full.out
          cat > /tmp/selfhost-parser-full.expected <<'EOF'
          program
          7
          EOF
          diff -u /tmp/selfhost-parser-full.expected /tmp/selfhost-parser-full.out

      - name: Self-hosted semantic checker
        shell: bash
        run: |
          cargo run --release -- check examples/selfhost_semantic.nova
          cargo run --release -- build-native-ssa examples/selfhost_semantic.nova /tmp/nova-selfhost-semantic
          /tmp/nova-selfhost-semantic > /tmp/selfhost-semantic.out
          cat > /tmp/selfhost-semantic.expected <<'EOF'
          0
          1
          cannot assign string to x
          EOF
          diff -u /tmp/selfhost-semantic.expected /tmp/selfhost-semantic.out

      - name: Self-hosted compiler bootstrap
        shell: bash
        run: |
          rm -f /tmp/nova-selfhost-generated.c /tmp/nova-selfhost-generated
          cargo run --release -- check examples/selfhost_compile.nova
          cargo run --release -- build-native-ssa examples/selfhost_compile.nova /tmp/nova-selfhost-compiler
          test -x /tmp/nova-selfhost-compiler
          /tmp/nova-selfhost-compiler > /tmp/selfhost-compiler.out
          cat /tmp/selfhost-compiler.out
          ls -l /tmp/nova-selfhost-generated.c || true
          test -s /tmp/nova-selfhost-generated.c
          cat /tmp/nova-selfhost-generated.c
          if ! cc -O2 -std=c11 /tmp/nova-selfhost-generated.c -o /tmp/nova-selfhost-generated > /tmp/nova-selfhost-cc.out 2>&1; then
            cat /tmp/nova-selfhost-cc.out
            exit 1
          fi
          test -x /tmp/nova-selfhost-generated
          /tmp/nova-selfhost-generated > /tmp/nova-selfhost-generated.out
          cat /tmp/nova-selfhost-generated.out
          test "$(cat /tmp/nova-selfhost-generated.out)" = "42"
